[package]
name = "fsm-rs-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Proc-macro DSL for fsm-rs; use the fsm-rs crate instead"
keywords = ["fsm", "state-machine", "macro"]

[lib]
proc-macro = true

[dependencies]
syn = { version = "2", features = ["full"] }
quote = "1"
proc-macro2 = "1"
