[package]
name = "fsm-rs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
description = "Akka-inspired async FSM library with compile-time transition exhaustiveness"
keywords = ["fsm", "state-machine", "statechart", "async", "macro"]
categories = ["data-structures", "asynchronous"]

[lints]
workspace = true

[dependencies]
fsm-rs-macros.workspace = true
async-trait = "0.1"
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"

[features]
serde = ["dep:serde"]

[[example]]
name = "purchase_persist"
required-features = ["serde"]
